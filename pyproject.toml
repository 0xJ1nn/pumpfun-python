[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pumpfun-python"
version = "0.2.0"
description = "Buy and sell on PumpFun bonding curves + PumpSwap AMM. Directly from Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "0xJ1nn" }]
keywords = [
    "pumpfun",
    "pumpswap",
    "solana",
    "defi",
    "dex",
    "bonding-curve",
    "amm",
    "trading",
    "crypto",
    "python",
    "async",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "solders>=0.21",
]

[project.urls]
Homepage = "https://github.com/0xJ1nn/pumpfun-python"
Repository = "https://github.com/0xJ1nn/pumpfun-python"
Issues = "https://github.com/0xJ1nn/pumpfun-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "solders.*"
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["pumpfun"]

[tool.hatch.build.targets.sdist]
include = ["pumpfun", "tests", "README.md", "CHANGELOG.md", "LICENSE"]